name: Sync GDL90 files from upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest files from upstream main
        run: |
          UPSTREAM="https://raw.githubusercontent.com/egite/Stratux-GDL90-to-SBS-Converter-for-Virtual-Radar-Server/main"
          curl -fsSL -o GDL90_to_SBS.py        "$UPSTREAM/GDL90_to_SBS.py"
          curl -fsSL -o GDL90_to_SBS-check.sh  "$UPSTREAM/GDL90_to_SBS-check.sh"

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain GDL90_to_SBS.py GDL90_to_SBS-check.sh)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add GDL90_to_SBS.py GDL90_to_SBS-check.sh
            git commit -m "Sync GDL90 files from upstream main"
            git push
          else
            echo "No changes to sync."
          fi
